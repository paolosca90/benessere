# Deployment Benessere; separate from the CreatorOS Compose project.
services:
  benessere-dashboard:
    image: benessere-web:20261021
    container_name: benessere-dashboard
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 120
    mem_limit: 300m
    cpus: 0.5
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
      TZ: Europe/Rome
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - /opt/benessere/data:/app/data:rw
      - /opt/benessere/source/app.py:/app/app.py:ro
      - /opt/benessere/source/benessere:/app/benessere:ro
    working_dir: /app
    command: ["python","-m","streamlit","run","app.py","--server.headless=true","--server.address=0.0.0.0","--server.port=8501","--browser.gatherUsageStats=false","--server.maxUploadSize=10"]
    networks: [existing_proxy]
  benessere-mcp:
    image: benessere-web:20261021
    container_name: benessere-mcp
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 90
    mem_limit: 180m
    cpus: 0.5
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
      TZ: Europe/Rome
      MCP_TOKEN_FILE: /run/secrets/mcp_token
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - /opt/benessere/data:/app/data:rw
      - /opt/benessere/source/benessere:/app/benessere:ro
      - /opt/benessere/source/mcp_server.py:/app/mcp_server.py:ro
      - /opt/benessere/source/mcp_remote.py:/app/mcp_remote.py:ro
      - /opt/benessere/private/mcp_token.txt:/run/secrets/mcp_token:ro
    working_dir: /app
    command: ["python","-u","mcp_remote.py"]
    networks: [existing_proxy]
  benessere-sheets-bridge:
    image: benessere-web:20261021
    container_name: benessere-sheets-bridge
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 60
    mem_limit: 96m
    cpus: 0.25
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: Europe/Rome
      BENESSERE_BRIDGE_TOKEN_FILE: /run/secrets/bridge_token
      BENESSERE_DB: /app/data/benessere.db
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - /opt/benessere/data:/app/data:rw
      - /opt/benessere/private/sheets_bridge_token.txt:/run/secrets/bridge_token:ro
      - /opt/benessere/source/benessere:/app/benessere:ro
      - /opt/benessere/source/sheets_bridge.py:/app/sheets_bridge.py:ro
    command: ["python", "-u", "sheets_bridge.py"]
    networks: [existing_proxy]
networks:
  existing_proxy:
    external: true
    name: app_default
